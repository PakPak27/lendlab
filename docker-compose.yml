# Local PostgreSQL for development and tests.
# Start:  docker compose up -d db
# Stop:   docker compose down        (data is kept in the "pgdata" volume)
# The Lab 5 version of this file will add the app and migration services.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lendlab
      POSTGRES_PASSWORD: lendlab
      POSTGRES_DB: lendlab
    ports:
      # Bound to 127.0.0.1 so the database is not reachable from other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
