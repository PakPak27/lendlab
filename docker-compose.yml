# Local run of the whole app in containers (Lab 5, Issue #24).
#
#   Database only (for npm run dev / tests):  docker compose up -d db
#   Whole app (fresh clone):                  copy .env.example to .env, set
#                                             DEMO_USER_PASSWORD, then
#                                             docker compose up --build
#   App:   http://localhost:3000        Stop: docker compose down
#
# Data is kept in the "pgdata" volume, so it survives `docker compose down`
# and a rebuild (R-04). `docker compose down -v` deletes it.
# The lendlab/lendlab database login is for this local container only; the
# cloud database uses its own password from Secret Manager.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lendlab
      POSTGRES_PASSWORD: lendlab
      POSTGRES_DB: lendlab
    ports:
      # Bound to 127.0.0.1 so the database is not reachable from other machines.
      # Set DB_PORT in .env if 5432 is already used on your machine.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lendlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: create/update the tables, then load the reference and demo
  # data. The same image runs this as a Cloud Run job before each release.
  migrate:
    build: .
    image: lendlab:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lendlab:lendlab@db:5432/lendlab?schema=public
      # The seed stops with a clear message if this is missing or too short.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    command: ["sh", "-c", "/app/node_modules/.bin/prisma migrate deploy && /app/node_modules/.bin/tsx prisma/seed.ts"]
    restart: "no"

  app:
    image: lendlab:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://lendlab:lendlab@db:5432/lendlab?schema=public
      NODE_ENV: production
      PORT: 3000
      GIT_SHA: ${GIT_SHA:-local}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
